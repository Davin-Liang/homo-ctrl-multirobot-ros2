/**:
  ros__parameters:
    # 领航机器人命名空间。
    leader_ns: "/robot1"
    # 跟随机器人命名空间。
    follower_ns: "/robot2"
    # 是否使用 ROS 仿真时钟。
    use_sim_time: true
    # 期望编队圆半径（m）。
    radius: 2.0
    # 控制器模型质量调参值，非实际质量。
    mass: 8.0
    # 偏航转动惯量调参值。
    I: 1.0
    # 平移期望闭环带宽（rad/s）。
    omega_d: 1.5
    # 偏航期望闭环带宽（rad/s）。
    omega_d_theta: 1.5
    # 平移 HPC 激活速度阈值（m/s）。
    hpc_vel_threshold: 0.3
    # 是否启用齐次控制升级。
    use_hpc: true
    # 安全圆上的离散编队点数量。
    m_p: 4
    # 编队点切换迟滞阈值（m）。
    tol: 0.1
    # 控制循环频率（Hz）。
    control_rate: 20.0
    # 全向轮滚动半径（m）。
    wheel_radius: 0.03
    # 机器人中心到车轮距离（m）。
    base_radius: 0.11
    # 单个车轮最大角速度（rad/s）。
    wheel_max_omega: 20.0
    # 最大线加速度（m/s²）。
    max_linear_accel: 2.0
    # 最大角加速度（rad/s²）。
    max_angular_accel: 4.0
    # 最大线速度（m/s）。
    max_linear_vel: 1.0
    # 最大角速度（rad/s）。
    max_angular_vel: 0.5
