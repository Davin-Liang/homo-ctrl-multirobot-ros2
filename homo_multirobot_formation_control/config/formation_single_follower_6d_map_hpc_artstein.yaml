/**:
  ros__parameters:
    # 领航机器人命名空间。
    leader_ns: "/robot1"
    # 跟随机器人命名空间。
    follower_ns: "/robot2"
    # 是否使用 ROS 仿真时钟。
    use_sim_time: true
    # 地图坐标系下编队偏移 x（m）。
    offset_map_x: -1.0
    # 地图坐标系下编队偏移 y（m）。
    offset_map_y: 0.0
    # 控制器模型质量调参值，非实际质量。
    mass: 2.0
    # 偏航转动惯量调参值。
    I: 1.0
    # 是否启用齐次控制升级。
    use_hpc: true
    # 控制循环频率（Hz）。
    control_rate: 20.0
    # HPC 变换系数下限。
    hpc_c_min: 0.5
    # 初始 LPC 极点下界。
    initial_min_lambda: 1.0
    # 平移等效电机时间常数（s）。
    tau: 0.43
    # 偏航等效电机时间常数（s）。
    tau_yaw: 0.43
    # 执行器纯滞后时间（s）。
    Td: 0.22
    # 全向轮滚动半径（m）。
    wheel_radius: 0.03
    # 机器人中心到车轮距离（m）。
    base_radius: 0.11
    # 单个车轮最大角速度（rad/s）。
    wheel_max_omega: 20.0
    # 最大线加速度（m/s²）。
    max_linear_accel: 2.0
    # 最大角加速度（rad/s²）。
    max_angular_accel: 4.0
    # 最大线速度（m/s）。
    max_linear_vel: 1.0
    # 最大角速度（rad/s）。
    max_angular_vel: 0.5
    # 非零命令最小速度（m/s）；0 表示关闭。
    min_cmd_vel: 0.0
    # 是否启用仿真电机延迟。
    use_motor_delay: false
    # 电机一阶滞后时间常数（s）。
    motor_tau: 0.43
    # 传输延迟（s）。
    transport_delay: 0.22
    # 延迟节点最大线加速度（m/s²）。
    delay_max_accel: 2.0
