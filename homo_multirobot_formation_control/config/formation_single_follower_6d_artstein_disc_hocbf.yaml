/**:
  ros__parameters:
    # 领航机器人命名空间。
    leader_ns: "/robot1"
    # 跟随机器人命名空间。
    follower_ns: "/robot2"
    # 是否使用 ROS 仿真时钟。
    use_sim_time: true
    # 期望编队圆半径（m）。
    radius: 2.0
    # 控制器模型质量调参值，非实际质量。
    mass: 2.0
    # 偏航转动惯量调参值。
    I: 1.0
    # 安全圆上的离散编队点数量。
    m_p: 4
    # 编队点切换迟滞阈值（m）。
    tol: 0.1
    # 是否启用齐次控制升级。
    use_hpc: true
    # 控制循环频率（Hz）。
    control_rate: 20.0
    # 平移等效电机时间常数（s）。
    tau: 0.43
    # 偏航等效电机时间常数（s）。
    tau_yaw: 0.43
    # 执行器纯滞后时间（s）。
    Td: 0.22
    # 最大线速度（m/s）。
    max_linear_vel: 1.0
    # 最大角速度（rad/s）。
    max_angular_vel: 0.5
    # 最大线加速度（m/s²）。
    max_linear_accel: 2.0
    # 最大角加速度（rad/s²）。
    max_angular_accel: 4.0
    # 全向轮滚动半径（m）。
    wheel_radius: 0.03
    # 机器人中心到车轮距离（m）。
    base_radius: 0.11
    # 单个车轮最大角速度（rad/s）。
    wheel_max_omega: 20.0
    # HPC 变换系数下限。
    hpc_c_min: 0.5
    # 初始 LPC 极点下界。
    initial_min_lambda: 1.0
    # 切换后 LPC 极点下界。
    switch_min_lambda: 4.0
    # 平移 HPC 激活速度阈值（m/s）。
    hpc_vel_threshold: 0.3
    # 偏航 HPC 激活速度阈值（rad/s）。
    hpc_yaw_threshold: 0.3
    # 稳定性裕度。
    stability_margin: 0.01
    # 激光雷达话题名。
    scan_topic: "scan"
    # 跟随机器人等效半径（m）。
    follower_radius: 0.15
    # 障碍物安全间隙（m）。
    clearance: 0.10
    # 感知范围附加裕度（m）。
    perception_margin: 0.15
    # 激光数据超时阈值（s）。
    scan_timeout: 0.30
    # TF 时间不匹配时是否使用最新变换。
    use_latest_tf_fallback: true
    # 窄通道切向引导增益。
    passage_gain: 0.25
    # 窄通道引导激活距离裕度（m）。
    passage_activation_margin: 0.60
    # 窄通道引导释放距离裕度（m）。
    passage_release_margin: 0.80
    # 激光点聚类距离阈值（m）。
    cluster_tolerance: 0.10
    # 有效障碍物簇最少点数。
    min_cluster_points: 5
    # 最多参与约束的障碍物数。
    max_obstacles: 10
    # 拟合圆柱最小半径（m）。
    min_cylinder_radius: 0.03
    # 拟合圆柱最大半径（m）。
    max_cylinder_radius: 0.60
    # 圆柱拟合最大残差（m）。
    max_fit_residual: 0.03
